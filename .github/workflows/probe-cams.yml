# Temporary: find public Huntington Beach surf cam embed sources from a network that can reach them. Removed before merge.
name: Probe surf cams
on:
  push:
    branches: ['claude/blissful-euler-u1up50']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: YouTube channel renderers, live search, live thumbnails
        shell: bash
        run: |
          set +e +o pipefail
          cat > yt3.py <<'PY'
          import re, json, urllib.request, urllib.parse, urllib.error
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          def get(url):
            req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9"})
            return urllib.request.urlopen(req, timeout=40).read().decode("utf-8", "replace")
          def status(url, headers=None):
            req = urllib.request.Request(url, headers={"User-Agent": UA, **(headers or {})})
            try:
              r = urllib.request.urlopen(req, timeout=30)
              return r.status, r.headers.get("Content-Type"), r.headers.get("Content-Length"), r.headers.get("Last-Modified"), r.headers.get("Cache-Control")
            except urllib.error.HTTPError as e:
              return e.code, e.headers.get("Content-Type"), None, None, None
            except Exception as e:
              return "ERR", str(e)[:80], None, None, None
          def items(o, out, kinds):
            if isinstance(o, dict):
              for k in ("videoRenderer", "gridVideoRenderer", "reelItemRenderer", "lockupViewModel", "compactVideoRenderer"):
                if k in o:
                  kinds[k] = kinds.get(k, 0) + 1
                  v = o[k]
                  vid = v.get("videoId") or v.get("contentId")
                  title = "".join(r.get("text","") for r in (v.get("title") or {}).get("runs", [])) or (v.get("title") or {}).get("simpleText") or json.dumps(v.get("metadata", {}))[:80]
                  live = False
                  for b in v.get("badges") or []:
                    if "LIVE" in ((b.get("metadataBadgeRenderer") or {}).get("label") or "").upper(): live = True
                  for ov in v.get("thumbnailOverlays") or []:
                    if (ov.get("thumbnailOverlayTimeStatusRenderer") or {}).get("style") == "LIVE": live = True
                  if '"LIVE"' in json.dumps(v)[:20000] and not live: live = "maybe"
                  out.append((k, live, vid, title[:70]))
              for x in o.values(): items(x, out, kinds)
            elif isinstance(o, list):
              for x in o: items(x, out, kinds)
          for url in ["https://www.youtube.com/channel/UCqaosllyy3vU5eHadlDShpg/streams",
                      "https://www.youtube.com/results?search_query=" + urllib.parse.quote("City of Huntington Beach") + "&sp=EgJAAQ%253D%253D"]:
            print("=" * 100); print("URL", url)
            try:
              html = get(url)
            except Exception as e:
              print("  ERROR", e); continue
            m = re.search(r"var ytInitialData = (\{.*?\});</script>", html, re.S)
            print("  bytes", len(html), "data:", bool(m), "| bot-gate:", "confirm you" in html)
            if not m: continue
            data = json.loads(m.group(1))
            kinds = {}; out = []; items(data, out, kinds)
            print("  renderer kinds:", kinds)
            for row in out[:20]: print("   ", row)
            keys = set(); 
            def walk(o):
              if isinstance(o, dict):
                for k, v in o.items():
                  if k.endswith("Renderer") or k.endswith("ViewModel"): keys.add(k)
                  walk(v)
              elif isinstance(o, list):
                for x in o: walk(x)
            walk(data)
            print("  all renderer keys:", sorted(k for k in keys if "ideo" in k or "ockup" in k or "rid" in k or "rich" in k.lower()))
          print("=" * 100); print("LIVE THUMBNAILS (200 = live?)")
          for vid in ["mhQjsLBfOoY", "RGYlFjV-dtc", "qY5-HXT4WSg", "O_E-buJR7Hs", "TuVOKRP7IBA"]:
            for name in ("hqdefault_live.jpg", "hqdefault.jpg", "maxresdefault_live.jpg"):
              print(f"  {vid} {name:24s}", status(f"https://i.ytimg.com/vi/{vid}/{name}"))
          PY
          python3 yt3.py
      - name: HBcams pages and Pixelcaster snapshots
        shell: bash
        run: |
          set +e +o pipefail
          cat > hb2.py <<'PY'
          import re, urllib.request, urllib.error
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          def get(url, headers=None):
            req = urllib.request.Request(url, headers={"User-Agent": UA, **(headers or {})})
            r = urllib.request.urlopen(req, timeout=40); return r
          home = get("https://hbcams.com/").read().decode("utf-8", "replace")
          links = sorted(set(re.findall(r"https?://hbcams\.com/[^\"'#?\s]*", home)))
          print("HBCAMS LINKS:"); [print("  ", l) for l in links]
          for m in re.finditer(r"<a[^>]+href=\"(https?://hbcams\.com/webcams[^\"]*)\"[^>]*>(.*?)</a>", home, re.S | re.I):
            print("   menu:", m.group(1), "|", " ".join(re.sub(r"<[^>]+>", " ", m.group(2)).split())[:60])
          for guess in ["https://hbcams.com/webcams-sunset-beach/", "https://hbcams.com/webcams-huntington-harbour/", "https://hbcams.com/webcams-huntington-harbor/", "https://hbcams.com/webcams-sunset-beach-live-stream/"]:
            try:
              r = get(guess); html = r.read().decode("utf-8", "replace")
              t = re.search(r"<title>(.*?)</title>", html, re.S | re.I)
              print("  GUESS", guess, r.status, " ".join(t.group(1).split()) if t else "")
              print("     camera:", re.findall(r"data-camera=\"([^\"]+)\"", html))
            except urllib.error.HTTPError as e:
              print("  GUESS", guess, e.code)
          for page in ["https://hbcams.com/webcams-huntington-beach-overview/", "https://hbcams.com/webcams-huntington-beach-pier-southwest/", "https://hbcams.com/webcams-huntington-beach-north-of-pier/", "https://hbcams.com/webcams-huntington-beach-south-of-pier/"]:
            html = get(page).read().decode("utf-8", "replace")
            print("  PAGE", page.split("/")[-2], "camera:", re.findall(r"data-camera=\"([^\"]+)\"", html), "poster:", re.findall(r"data-poster=\"([^\"]+)\"", html))
            for m in re.finditer(r"<h[1-3][^>]*>(.*?)</h[1-3]>", html, re.S | re.I):
              txt = " ".join(re.sub(r"<[^>]+>", " ", m.group(1)).split())
              if txt and len(txt) < 80: print("     h:", txt)
          print("=" * 100); print("SNAPSHOTS")
          for cam in ["hb-pier-north", "hb-pier-south", "hb-pier-west", "hb-innocean", "hb-harbour", "hb-sunset-beach"]:
            for size in ["latest_640x.jpg", "latest_1280x.jpg", "latest.jpg", "latest_320x.jpg"]:
              url = f"https://cdn.pixelcaster.com/public.pixelcaster.com/snapshots/{cam}/{size}"
              for ref in [None, "https://mrcaden4.github.io/magicseaweed/"]:
                try:
                  r = get(url, {"Referer": ref} if ref else None)
                  print(f"  {cam:16s} {size:18s} ref={'yes' if ref else 'no ':3s} {r.status} {r.headers.get('Content-Type')} {r.headers.get('Content-Length')} lm={r.headers.get('Last-Modified')} cc={r.headers.get('Cache-Control')} acao={r.headers.get('Access-Control-Allow-Origin')}")
                except urllib.error.HTTPError as e:
                  print(f"  {cam:16s} {size:18s} ref={'yes' if ref else 'no ':3s} {e.code}")
                except Exception as e:
                  print(f"  {cam:16s} {size:18s} ERR {e}")
          PY
          python3 hb2.py

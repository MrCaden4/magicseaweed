# Temporary: probe EPA UV endpoints from a network that can reach epa.gov. Removed before merge.
name: Probe EPA UV endpoints
on:
  push:
    branches: ['claude/blissful-euler-u1up50']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Daily endpoints, and hourly for other locations
        shell: bash
        run: |
          set +e +o pipefail
          probe() {
            local meta
            meta=$(curl -sS -o body.out -L --max-time 40 -A 'hb-surf-site/1.0 (github.com/MrCaden4/magicseaweed)' -w '%{http_code} %{url_effective} %{content_type}' "$1" 2>curl.err)
            echo "=== ${meta:-curl-failed: $(cat curl.err)}"
            echo "    requested: $1  body=$(wc -c < body.out 2>/dev/null || echo 0) bytes"
            head -c 500 body.out 2>/dev/null | tr -d '\000'; echo; echo
          }
          probe "https://data.epa.gov/dmapservice/getEnvirofactsUVDAILY/ZIP/92648/JSON"
          probe "https://data.epa.gov/efservice/getEnvirofactsUVDAILY/ZIP/92648/JSON"
          probe "https://data.epa.gov/dmapservice/getEnvirofactsUVDAILY/CITY/Huntington%20Beach/STATE/CA/JSON"
          probe "https://data.epa.gov/dmapservice/getEnvirofactsUVHOURLY/ZIP/90210/JSON"
          probe "https://data.epa.gov/dmapservice/getEnvirofactsUVHOURLY/ZIP/10001/JSON"
          probe "https://data.epa.gov/dmapservice/getEnvirofactsUVDAILY/ZIP/10001/JSON"
          true
      - name: Endpoints used by EPA's own UV search app
        shell: bash
        run: |
          set +e +o pipefail
          curl -sS -L --max-time 40 "https://enviro.epa.gov/envirofacts/uv/search" > search.html
          js=$(grep -o -E 'src="/assets/[^"]+\.js"' search.html | head -1 | sed -E 's/src="([^"]+)"/\1/')
          echo "bundle: $js"
          curl -sS -L --max-time 60 "https://enviro.epa.gov$js" > bundle.js
          echo "bundle bytes: $(wc -c < bundle.js)"
          grep -o -E '[A-Za-z0-9_./:-]*(UVHOURLY|UVDAILY|uv_hourly|uv_daily|dmapservice|efservice)[A-Za-z0-9_./:${}-]*' bundle.js | sort -u | head -40
          echo "--- URL strings mentioning epa ---"
          grep -o -E '"[^"]*//[^"]*"' bundle.js | grep -i 'epa' | sort -u | head -40
          echo "--- path strings mentioning uv/api/service ---"
          grep -o -E '"/[A-Za-z0-9_./-]*"' bundle.js | grep -i -E 'uv|api|service' | sort -u | head -40
          true
